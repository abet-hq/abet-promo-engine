name: repack alpha (hardened key, cloud)

on:
  workflow_dispatch:

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Hardened re-key from green sources over current clips' audio
        run: |
          mkdir -p out
          declare -A M=( [A_a_open]=open_a [B_b_hook]=hook_b [A_a_proof]=proof_a [B_b_cta]=cta_b )
          for src in "${!M[@]}"; do
            clip=${M[$src]}
            curl -sL "https://abet-promo.pages.dev/clips/$clip.webm" -o "/tmp/$clip-orig.webm"
            ffmpeg -y -hide_banner -loglevel error \
              -i "sources/green/$src.mp4" -i "/tmp/$clip-orig.webm" \
              -filter_complex "[0:v]chromakey=0x18A03C:0.12:0.05,format=rgba,colorchannelmixer=aa=3,scale=640:640:flags=lanczos[v]" \
              -map "[v]" -map 1:a -c:v libvpx-vp9 -pix_fmt yuva420p -b:v 1.5M -auto-alt-ref 0 -c:a libopus -b:a 96k -shortest "out/$clip.webm"
            echo "$clip done"
          done
          ls -la out/
      - name: Verify alpha (composite over white -> corners must be WHITE, never green)
        run: |
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i color=c=white:s=800x800:d=1 \
            -c:v libvpx-vp9 -i out/open_a.webm \
            -filter_complex "[1:v]scale=-2:640[av];[0:v][av]overlay=W-w:H-h[o]" -map "[o]" -frames:v 1 out/alpha_check.png
          ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: hardened-clips
          path: out/
