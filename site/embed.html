<!doctype html><html><head><meta charset="utf-8"><title>ABET SPORTS DESK</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;}
/* BOUNDED PLAYER: rounded golden edge, blank canvas, avatar only. Fills its iframe. */
#frame{position:absolute;inset:6px;border-radius:26px;border:3px solid #e6b93f;
  box-shadow:0 0 0 1px rgba(255,220,130,.28), 0 0 26px rgba(230,185,63,.20);
  background:#050505;overflow:hidden;}
.vid{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  height:min(86%,86vw);width:auto;display:block;
  opacity:0;transition:opacity .55s ease;}
.vid.front{opacity:1;}
</style></head><body>
<div id="frame">
  <video id="va" class="vid front" muted playsinline></video>
  <video id="vb" class="vid" muted playsinline></video>
</div>
<script>
const params = new URLSearchParams(location.search);
const va = document.getElementById('va'), vb = document.getElementById('vb');
let segs = [], idx = 0, front = va, back = vb, switching = false;
async function boot(){
  let st; try { st = await (await fetch('state.json', {cache:'no-store'})).json(); } catch(e){ st = {segments: []}; }
  segs = (st.segments || []).filter(s => s.clip);
  if (!segs.length) return;
  if (params.get('sound') === '1'){ va.muted = false; vb.muted = false; }
  load(front, segs[0]);
  setInterval(checkEnd, 200);
  front.addEventListener('ended', advance);
}
function load(v, seg){ v.src = seg.clip; v.currentTime = 0; v.play().catch(()=>{}); }
function checkEnd(){
  if (switching || !isFinite(front.duration) || !front.duration) return;
  if (front.currentTime >= front.duration - 0.45) advance();
}
function advance(){
  if (switching || !segs.length) return;
  switching = true;
  idx = (idx + 1) % segs.length;
  load(back, segs[idx]);
  requestAnimationFrame(() => { back.classList.add('front'); front.classList.remove('front'); });
  setTimeout(() => {
    const t = front; front = back; back = t;
    setTimeout(() => { try { back.pause(); } catch(e){} }, 150);
    switching = false;
  }, 620);
}
boot();
</script></body></html>
