<!doctype html><html><head><meta charset="utf-8"><title>ABET SPORTS DESK</title>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;
  display:flex;align-items:center;justify-content:center;}
#wrap{display:flex;flex-direction:column;align-items:center;gap:10px;
  width:min(calc(100vw - 24px), calc((100vh - 170px) * 16 / 9), 960px);
  box-sizing:border-box;max-width:100vw;}
/* THE PLAYER: regular 16:9 box, golden rounded edge. Contains ONLY highlights + talent. */
#frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#050505;
  border:3px solid #e6b93f;border-radius:24px;box-sizing:border-box;
  box-shadow:0 0 0 1px rgba(255,220,130,.28), 0 0 26px rgba(230,185,63,.20);}
#bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:brightness(.52) saturate(.95);opacity:0;transition:opacity .5s ease;}
#bgv.show{opacity:1;}
/* TALENT: corner cutout, side alternates randomly per segment */
.vid{position:absolute;bottom:0;height:82%;width:auto;display:block;z-index:2;
  opacity:0;transition:opacity 1.1s ease;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.5));}
.vid.side-left{left:2%;right:auto;}
.vid.side-right{right:2%;left:auto;}
.vid.front{opacity:1;}
/* CAPTIONS: plain text only, no pill, no border. */
#captionpill{display:flex;justify-content:center;width:100%;min-height:34px;}
#captext{max-width:100%;color:#fff;font-family:Impact,'Arial Black',Arial,sans-serif;
  font-style:italic;font-size:clamp(26px,4vw,42px);letter-spacing:.5px;text-align:center;
  text-shadow:0 2px 10px #000, 0 0 3px #000;
  opacity:0;transition:opacity .3s;}
#captext.show{opacity:1;}
/* TICKER: ABET line moves scrolling */
#ticker{width:100%;height:28px;overflow:hidden;background:rgba(0,0,0,.85);
  border-top:1px solid rgba(230,185,63,.3);border-radius:0 0 8px 8px;}
#tk-track{white-space:nowrap;color:#00ff41;font:700 16px/28px 'Doto',monospace;
  padding:0 12px;animation:scroll 30s linear infinite;
  text-shadow:0 0 2px #00ff41, 0 0 6px #00ff41, 0 0 10px rgba(0,255,65,.4);
  letter-spacing:2px;}
#tk-track .red{color:#ff3333;text-shadow:0 0 2px #ff3333, 0 0 6px #ff3333, 0 0 10px rgba(255,51,51,.4);}
#tk-track .red{color:#ff3333;text-shadow:0 0 4px #ff3333;}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
/* CHAT LINE: latest chat message */
#chatline{width:100%;min-height:20px;color:rgba(255,255,255,.7);
  font:400 12px/20px system-ui;text-align:center;opacity:.8;}
/* CONTROLS: caption toggle + audio toggle */
#controls{display:flex;gap:10px;}
.ctl{width:40px;height:40px;border-radius:50%;background:rgba(18,18,22,.9);
  border:1px solid rgba(255,255,255,.18);color:#e8e8e8;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  font-family:Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;}
.ctl:hover{border-color:rgba(230,185,63,.6);}
#ccbtn.off{opacity:.45;text-decoration:line-through;}
#sndbtn .slash{display:block;position:absolute;}
#sndbtn.on .slash{display:none;}
</style></head><body>
<div id="wrap">
  <div id="frame">
    <video id="bgv" muted loop playsinline preload="auto"></video>
    <video id="va" class="vid" muted playsinline preload="auto"></video>
    <video id="vb" class="vid" muted playsinline preload="auto"></video>
  </div>
  <div id="captionpill"><span id="captext"></span></div>
<div id="ticker"><div id="tk-track"></div></div>
<div id="chatline"></div>
  <div id="controls">
    <button id="ccbtn" class="ctl" onclick="toggleCC()" title="captions">CC</button>
    <button id="sndbtn" class="ctl" onclick="toggleSound()" title="sound" style="position:relative">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M12 4L7.5 8H4a1 1 0 00-1 1v6a1 1 0 001 1h3.5L12 20V4z"/><path d="M15.5 9.2a4 4 0 010 5.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M18 6.8a7.4 7.4 0 010 10.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <svg class="slash" viewBox="0 0 24 24" width="40" height="40" style="position:absolute"><circle cx="12" cy="12" r="9.2" fill="none" stroke="#e33" stroke-width="2.2"/><line x1="5.8" y1="18.2" x2="18.2" y2="5.8" stroke="#e33" stroke-width="2.2"/></svg>
    </button>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const va = document.getElementById('va'), vb = document.getElementById('vb');
const bgv = document.getElementById('bgv'), captext = document.getElementById('captext');
let segs = [], hi = [], hiIdx = 0, idx = 0, front = va, back = vb, switching = false, frontSeg = null;
let playsDone = 0, ccOn = true, soundOn = false;
const PLAYS_PER_SEGMENT = 3;     // anti-frantic: each segment repeats 3x before rotating
const FADE_MS = 1100;
function pickSide(el){ el.classList.toggle('side-left', Math.random() < 0.5); el.classList.toggle('side-right', !el.classList.contains('side-left')); }
async function boot(){
  let st = {segments: []}, desk = null;
  try { st = await (await fetch('state.json', {cache:'no-store'})).json(); } catch(e){}
  try { const dr = await fetch('desk_state.json', {cache:'no-store'}); if (dr.ok) desk = await dr.json(); } catch(e){}
  segs = (st.segments || []).filter(s => s.clip);
  let fb = [];
  try { const fr = await fetch('highlights_fallback.json', {cache:'no-store'}); if (fr.ok) fb = (await fr.json()).map(x => x.url).filter(Boolean); } catch(e){}
  const deskHi = ((desk && desk.highlights) || []).map(h => h.url).filter(Boolean);
  hi = [...deskHi, ...fb].filter((u, i, a) => a.indexOf(u) === i);
  if (hi.length) { bgv.src = hi[0]; bgv.play().then(()=>bgv.classList.add('show')).catch(()=>{}); }
  bgv.addEventListener('error', () => { if (hi.length > 1) { hiIdx = (hiIdx + 1) % hi.length; bgv.src = hi[hiIdx]; bgv.play().catch(()=>{}); } else { bgv.classList.remove('show'); } });
  if (!segs.length) return;
  if (params.get('sound') === '1') setSound(true);
  pickSide(front);
  front.classList.add('front');
  load(front, segs[0]);
  front.addEventListener('playing', () => { frontSeg = segs[0]; }, {once: true});
  setInterval(() => { checkEnd(); tickCaption(); }, 150);
}
function load(v, seg){ v.src = seg.clip; v.currentTime = 0; v.play().catch(()=>{}); }
function checkEnd(){
  if (switching || !isFinite(front.duration) || !front.duration) return;
  if (front.currentTime >= front.duration - FADE_MS / 1000){
    if (playsDone + 1 < PLAYS_PER_SEGMENT){
      playsDone++;
      front.currentTime = 0;
      front.play().catch(()=>{});
    } else advance();
  }
}
function advance(){
  if (switching || !segs.length) return;
  switching = true;
  playsDone = 0;
  idx = (idx + 1) % segs.length;
  const incoming = segs[idx];
  pickSide(back);
  load(back, incoming);
  if (hi.length){
    hiIdx = (hiIdx + 1) % hi.length;
    bgv.classList.remove('show');
    setTimeout(() => { bgv.src = hi[hiIdx]; bgv.play().then(()=>bgv.classList.add('show')).catch(()=>{}); }, 220);
  }
  requestAnimationFrame(() => { back.classList.add('front'); front.classList.remove('front'); });
  setTimeout(() => {
    const t = front; front = back; back = t;
    frontSeg = incoming;
    setTimeout(() => { try { back.pause(); } catch(e){} }, 200);
    switching = false;
  }, FADE_MS + 80);
}
function tickCaption(){
  if (!frontSeg || front.paused || front.readyState < 3) return;
  const seg = frontSeg;
  const t = front.currentTime || 0;
  const s = ccOn && seg && (seg.captions || []).find(x => t >= x[1] && t <= x[2]);
  if (s){ if (captext.textContent !== s[0]) captext.textContent = s[0]; captext.classList.add('show'); }
  else captext.classList.remove('show');
}
function setSound(on){
  soundOn = on;
  va.muted = !on; vb.muted = !on;
  document.getElementById('sndbtn').classList.toggle('on', on);
  front.play().catch(()=>{});
}
function toggleSound(){ setSound(!soundOn); }
function toggleCC(){
  ccOn = !ccOn;
  document.getElementById('ccbtn').classList.toggle('off', !ccOn);
  if (!ccOn){ captext.classList.remove('show'); captext.textContent = ''; }
}
// Live desk poll — fetches desk_state.json every 20s, updates captions/ticker/chat on change
let deskState = null;
async function pollDesk(){
  try{
    const r = await fetch('desk_state.json?v=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const s = await r.json();
    if(!deskState || s.generated !== deskState.generated){
      deskState = s;
      // captions - only show when an anchor is actually visible on screen
      if(s.script_hint && frontSeg && front.classList.contains('front')){ captext.textContent = s.script_hint; captext.classList.add('show'); }

      // ticker
      const tk = document.getElementById('tk-track');
      if(tk && s.abet_lines && s.abet_lines.length) tk.textContent = s.abet_lines.map(l=>l.note).join('   •   ');
      // chat line
      const cl = document.getElementById('chatline');
      if(cl && s.chat && s.chat.length) cl.textContent = s.chat[s.chat.length-1];
      // highlights refresh
      const deskHi = ((s.highlights) || []).map(h => h.url).filter(Boolean);
      if(deskHi.length){ hi = [...deskHi, ...hi].filter((u,i,a)=>a.indexOf(u)===i); }
    }
  }catch(e){ /* silent retry */ }
}
setInterval(pollDesk, 20000);
pollDesk();
boot();
</script></body></html>
