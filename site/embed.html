<!doctype html><html><head><meta charset="utf-8"><title>ABET SPORTS DESK - embed</title>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden;font-family:Impact,'Arial Black',Arial,sans-serif;}
#stage{position:relative;width:100vw;height:100vh;background:#050505;}
#content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#2a2a2a;font-size:min(4vw,28px);letter-spacing:3px;}
#avatar{position:absolute;right:0;bottom:0;width:55%;z-index:3;}
#avatar video{width:100%;display:block;filter:drop-shadow(0 8px 20px rgba(0,0,0,.8));}
#caption{position:absolute;top:6%;right:2%;max-width:46%;padding:8px 14px;z-index:4;border-radius:999px;background:rgba(0,0,0,.6);border:1px solid rgba(255,192,51,.55);color:#fff;font-size:clamp(11px,1.6vw,17px);font-style:italic;text-shadow:0 2px 6px #000;text-align:center;opacity:0;transition:opacity .25s;}
#caption.show{opacity:1;}
#ticker{position:absolute;left:0;right:0;bottom:0;padding:5px 10px;z-index:3;background:rgba(0,0,0,.7);color:#ffe;font-size:clamp(9px,1.3vw,13px);white-space:nowrap;overflow:hidden;}
#ticker span{display:inline-block;padding-left:100%;animation:tick 22s linear infinite;}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-100%)}}
#sound{position:absolute;left:2%;bottom:12%;padding:4px 10px;border-radius:999px;background:#ffc233;color:#000;font-size:11px;cursor:pointer;border:2px solid #000;z-index:4;opacity:.9;}
</style></head><body>
<div id="stage">
  <div id="content">[abet sports desk]</div>
  <div id="avatar"><video id="av" autoplay muted loop playsinline></video></div>
  <div id="caption"></div>
  <div id="ticker"><span id="ticktext">ABET SPORTS DESK - LIVE</span></div>
  <button id="sound" onclick="toggleAudio()">SOUND: OFF</button>
</div>
<script>
const params = new URLSearchParams(location.search);
let av, cap, ticktext, state, segIdx = 0, currentSeg = null;
async function boot(){
  const r = await fetch('state.json'); state = await r.json();
  av = document.getElementById('av'); cap = document.getElementById('caption');
  ticktext = document.getElementById('ticktext');
  ticktext.textContent = (state.ticker || 'ABET SPORTS DESK - LIVE') + '  //  ';
  if(params.get('sound') === '1'){ av.muted = false; document.getElementById('sound').textContent = 'SOUND: ON'; }
  playSegment(0);
  setInterval(tickCaption, 120);
}
function playSegment(i){
  const segs = state.segments && state.segments.length ? state.segments : null;
  if(!segs) return;
  segIdx = ((i % segs.length) + segs.length) % segs.length;
  currentSeg = segs[segIdx];
  av.onended = () => playSegment(segIdx + 1);
  av.loop = false;
  av.src = currentSeg.clip;
  av.load(); av.play().catch(()=>{});
}
function tickCaption(){
  if(!currentSeg) return;
  const t = av.currentTime || 0;
  const s = (currentSeg.captions||[]).find(x => t>=x[1] && t<=x[2]);
  if(s){ if(cap.textContent!==s[0]) cap.textContent = s[0]; cap.classList.add('show'); }
  else cap.classList.remove('show');
}
function toggleAudio(){ av.muted=!av.muted; document.getElementById('sound').textContent = av.muted?'SOUND: OFF':'SOUND: ON'; av.play().catch(()=>{}); }
boot();
</script></body></html>
